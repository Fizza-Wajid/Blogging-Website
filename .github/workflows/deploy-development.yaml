build:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: npm install -D parcel

    - name: Build site
      run: npx parcel build src/*.html --dist-dir build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build
